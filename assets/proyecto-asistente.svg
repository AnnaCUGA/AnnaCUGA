<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="t">
  <title id="t">AI educational assistant. End-to-end automated workflow in n8n with AI agents, computer vision and MySQL. It evaluates the images users submit as evidence and keeps the context of each conversation. Work project at Fundación Televisa, private code.</title>
  <defs><pattern id="p" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#aaa3cd" opacity="0.16"/></pattern>
    <style>
      .k { font: 600 14px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ff9a8b; }
      .ti { font: 800 34px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #edeafb; letter-spacing: -0.5px; }
      .de { font: 400 17px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #aaa3cd; }
      .tg { font: 500 13px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #aaa3cd; }
      .n { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #edeafb; }
      .s { font: 400 12px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #aaa3cd; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="16" fill="#1f1b3a" stroke="#373063"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="16" fill="url(#p)"/>
  <rect x="0" y="34" width="4" height="62" rx="2" fill="#ff9a8b"/>
  <text class="k" x="36" y="52">Featured, in my current role at Fundación Televisa</text>
  <text class="ti" x="36" y="92">AI educational assistant</text>
  <text class="de" x="36" y="132">End-to-end automated workflow that combines AI agents,</text>
  <text class="de" x="36" y="158">computer vision and MySQL. It evaluates the images users</text>
  <text class="de" x="36" y="184">submit as evidence and keeps the context of each conversation.</text>
  <rect x="36" y="232" width="44" height="26" rx="13" fill="none" stroke="#373063"/><text class="tg" x="58.0" y="249.5" text-anchor="middle">n8n</text><rect x="88" y="232" width="89" height="26" rx="13" fill="none" stroke="#373063"/><text class="tg" x="132.5" y="249.5" text-anchor="middle">AI agents</text><rect x="185" y="232" width="52" height="26" rx="13" fill="none" stroke="#373063"/><text class="tg" x="211.0" y="249.5" text-anchor="middle">LLMs</text><rect x="245" y="232" width="133" height="26" rx="13" fill="none" stroke="#373063"/><text class="tg" x="311.5" y="249.5" text-anchor="middle">Computer vision</text><rect x="386" y="232" width="44" height="26" rx="13" fill="none" stroke="#373063"/><text class="tg" x="408.0" y="249.5" text-anchor="middle">RAG</text><rect x="438" y="232" width="59" height="26" rx="13" fill="none" stroke="#373063"/><text class="tg" x="467.5" y="249.5" text-anchor="middle">MySQL</text>
  
  <g transform="translate(652 22) scale(0.94)">
    <path d="M150 50 H205" fill="none" stroke="#7fe0c9" stroke-width="2"/>
    <path d="M355 50 H400" fill="none" stroke="#7fe0c9" stroke-width="2"/>
    <path id="s1" d="M250 90 C250 150 85 130 85 190" fill="none" stroke="#4a4280" stroke-width="1.5" stroke-dasharray="5 5"/>
    <path id="s2" d="M280 90 V190" fill="none" stroke="#4a4280" stroke-width="1.5" stroke-dasharray="5 5"/>
    <path id="s3" d="M310 90 C310 150 475 130 475 190" fill="none" stroke="#4a4280" stroke-width="1.5" stroke-dasharray="5 5"/>
    <circle r="5" fill="#7fe0c9"><animateMotion dur="3.6s" repeatCount="indefinite" path="M150 50 H205 M355 50 H400" keyPoints="0;0.55;0.55;1" keyTimes="0;0.3;0.7;1" calcMode="linear"/></circle>
    <circle r="3.5" fill="#ff9a8b"><animateMotion dur="3.6s" begin="0.9s" repeatCount="indefinite" keyPoints="0;1;0;0" keyTimes="0;0.2;0.4;1" calcMode="linear"><mpath href="#s1"/></animateMotion></circle>
    <circle r="3.5" fill="#ff9a8b"><animateMotion dur="3.6s" begin="1.1s" repeatCount="indefinite" keyPoints="0;1;0;0" keyTimes="0;0.2;0.4;1" calcMode="linear"><mpath href="#s2"/></animateMotion></circle>
    <circle r="3.5" fill="#ff9a8b"><animateMotion dur="3.6s" begin="1.3s" repeatCount="indefinite" keyPoints="0;1;0;0" keyTimes="0;0.2;0.4;1" calcMode="linear"><mpath href="#s3"/></animateMotion></circle>

    <rect x="0" y="20" width="150" height="60" rx="10" fill="#15122a" stroke="#373063" stroke-width="1.5"/>
    <text class="n" x="16" y="46">Message</text><text class="s" x="16" y="65">text or image</text>
    <rect x="205" y="10" width="150" height="80" rx="10" fill="#15122a" stroke="#ff9a8b" stroke-width="2">
      <animate attributeName="stroke-opacity" values="1;0.45;1" dur="3.6s" repeatCount="indefinite"/></rect>
    <text class="n" x="221" y="44">AI agent</text><text class="s" x="221" y="64">calls the tools</text>
    <rect x="400" y="20" width="150" height="60" rx="10" fill="#15122a" stroke="#373063" stroke-width="1.5"/>
    <text class="n" x="416" y="46">Reply</text><text class="s" x="416" y="65">to the user</text>

    <rect x="10" y="190" width="150" height="56" rx="28" fill="#15122a" stroke="#373063" stroke-width="1.5"/>
    <text class="n" x="85" y="215" text-anchor="middle">LLM</text><text class="s" x="85" y="233" text-anchor="middle">language model</text>
    <rect x="205" y="190" width="150" height="56" rx="28" fill="#15122a" stroke="#373063" stroke-width="1.5"/>
    <text class="n" x="280" y="215" text-anchor="middle">Vision</text><text class="s" x="280" y="233" text-anchor="middle">checks evidence</text>
    <rect x="400" y="190" width="150" height="56" rx="28" fill="#15122a" stroke="#373063" stroke-width="1.5"/>
    <text class="n" x="475" y="215" text-anchor="middle">MySQL</text><text class="s" x="475" y="233" text-anchor="middle">chat context</text>
  </g>
</svg>

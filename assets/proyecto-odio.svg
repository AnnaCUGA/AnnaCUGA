<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 270" role="img" aria-labelledby="t">
  <title id="t">Hate speech classification. Multiclass NLP classifier for social media. scikit-learn, TF-IDF, Random Forest. 0.84 accuracy.</title>
  <defs><pattern id="p" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#aaa3cd" opacity="0.16"/></pattern>
    <style>
      .ti { font: 700 24px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #edeafb; }
      .de { font: 400 16px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #aaa3cd; }
      .tg { font: 500 13px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #aaa3cd; }
      .me { font: 800 40px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #7fe0c9; }
      .ml { font: 500 14px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #aaa3cd; }
      .n { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #edeafb; }
      .s { font: 400 12px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #aaa3cd; }
      .ax { font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #aaa3cd; }
      .bar { transform-box: fill-box; transform-origin: bottom; animation: grow 1.1s ease-out both; }
      .draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: draw 2.2s ease-out forwards; }
      .px { animation: tw 3s ease-in-out infinite; }
      .hbar { transform-box: fill-box; transform-origin: left; animation: growx 1.1s ease-out both; }
      @keyframes growx { from { transform: scaleX(0) } to { transform: scaleX(1) } }
      @keyframes grow { from { transform: scaleY(0) } to { transform: scaleY(1) } }
      @keyframes draw { to { stroke-dashoffset: 0 } }
      @keyframes tw { 50% { opacity: 0.25 } }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="589" height="269" rx="16" fill="#1f1b3a" stroke="#373063"/>
  <rect x="0.5" y="0.5" width="589" height="269" rx="16" fill="url(#p)"/>
  <rect x="0" y="28" width="4" height="34" rx="2" fill="#ff9a8b"/>
  <text class="ti" x="32" y="54">Hate speech classification</text>
  <text class="de" x="32" y="96">Multiclass NLP classifier for social</text><text class="de" x="32" y="120">media, tuned with GridSearchCV.</text>
  <rect x="32" y="218" width="111" height="26" rx="13" fill="none" stroke="#373063"/><text class="tg" x="87.5" y="235.5" text-anchor="middle">scikit-learn</text><rect x="151" y="218" width="66" height="26" rx="13" fill="none" stroke="#373063"/><text class="tg" x="184.0" y="235.5" text-anchor="middle">TF-IDF</text><rect x="225" y="218" width="118" height="26" rx="13" fill="none" stroke="#373063"/><text class="tg" x="284.0" y="235.5" text-anchor="middle">Random Forest</text>
  <text class="me" x="32" y="196">0.84</text>
  <text class="ml" x="131" y="194">accuracy</text>
  <rect class="bar" style="animation-delay:0.0s" x="388" y="110" width="18" height="80" rx="3" fill="#ff9a8b"/><text class="ax" x="397" y="102" text-anchor="middle">.73</text><rect class="bar" style="animation-delay:0.12s" x="418" y="101" width="18" height="89" rx="3" fill="#7fe0c9"/><text class="ax" x="427" y="93" text-anchor="middle">.81</text><rect class="bar" style="animation-delay:0.24s" x="448" y="92" width="18" height="98" rx="3" fill="#7fe0c9"/><text class="ax" x="457" y="84" text-anchor="middle">.89</text><rect class="bar" style="animation-delay:0.36s" x="478" y="92" width="18" height="98" rx="3" fill="#7fe0c9"/><text class="ax" x="487" y="84" text-anchor="middle">.89</text><rect class="bar" style="animation-delay:0.48s" x="508" y="90" width="18" height="100" rx="3" fill="#7fe0c9"/><text class="ax" x="517" y="82" text-anchor="middle">.91</text><rect class="bar" style="animation-delay:0.6s" x="538" y="118" width="18" height="72" rx="3" fill="#ff9a8b"/><text class="ax" x="547" y="110" text-anchor="middle">.65</text><line x1="380" y1="190.5" x2="566" y2="190.5" stroke="#373063"/><text class="ax" x="566" y="208" text-anchor="end">precision by class</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
  <title id="t">Ana Cuevas, Data and AI Analyst</title>
  <desc id="d">Banner with a workflow diagram: a message reaches an AI agent that calls a language model, a vision model and MySQL, and sends a reply.</desc>
  <defs>
    <pattern id="puntos" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#aaa3cd" opacity="0.16"/>
    </pattern>
    <style>
      .nombre { font: 800 84px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #edeafb; letter-spacing: -2px; }
      .rol { font: 600 26px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #7fe0c9; }
      .linea { font: 400 19px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #aaa3cd; }
      .caja { fill: #15122a; stroke: #373063; stroke-width: 1.5; }
      .agente { stroke: #ff9a8b; stroke-width: 2; }
      .n { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #edeafb; }
      .s { font: 400 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #aaa3cd; }
      .cable { fill: none; stroke: #7fe0c9; stroke-width: 2; }
      .sub { fill: none; stroke: #4a4280; stroke-width: 1.5; stroke-dasharray: 5 5; }
    </style>
  </defs>

  <rect width="1200" height="340" rx="18" fill="#15122a"/>
  <rect width="1200" height="340" rx="18" fill="url(#puntos)"/>

  <!-- nombre y rol -->
  <text class="nombre" x="64" y="150">Ana Cuevas</text>
  <text class="rol" x="66" y="200">Data &amp; AI Analyst</text>
  <text class="linea" x="66" y="242">AI agents, n8n automation and</text>
  <text class="linea" x="66" y="268">machine learning in Python</text>

  <!-- diagrama de flujo -->
  <g transform="translate(600 46)">
    <rect x="-20" y="-16" width="590" height="280" rx="14" fill="#1f1b3a" stroke="#373063"/>

    <path class="cable" d="M150 50 H205"/>
    <path class="cable" d="M355 50 H400"/>
    <path class="sub" d="M250 90 C250 150 85 130 85 190"/>
    <path class="sub" d="M280 90 V190"/>
    <path class="sub" d="M310 90 C310 150 475 130 475 190"/>
    <circle r="5" fill="#7fe0c9">
      <animateMotion dur="3.2s" repeatCount="indefinite" path="M150 50 H205 M355 50 H400" keyPoints="0;0.55;0.55;1" keyTimes="0;0.35;0.65;1" calcMode="linear"/>
    </circle>

    <rect class="caja" x="0" y="20" width="150" height="60" rx="10"/>
    <text class="n" x="16" y="46">Message</text>
    <text class="s" x="16" y="65">text or image</text>

    <rect class="caja agente" x="205" y="10" width="150" height="80" rx="10"/>
    <text class="n" x="221" y="44">AI agent</text>
    <text class="s" x="221" y="64">calls the tools</text>

    <rect class="caja" x="400" y="20" width="150" height="60" rx="10"/>
    <text class="n" x="416" y="46">Reply</text>
    <text class="s" x="416" y="65">to the user</text>

    <rect class="caja" x="10" y="190" width="150" height="56" rx="28"/>
    <text class="n" x="85" y="215" text-anchor="middle">LLM</text>
    <text class="s" x="85" y="233" text-anchor="middle">OpenAI API</text>

    <rect class="caja" x="205" y="190" width="150" height="56" rx="28"/>
    <text class="n" x="280" y="215" text-anchor="middle">Vision</text>
    <text class="s" x="280" y="233" text-anchor="middle">checks evidence</text>

    <rect class="caja" x="400" y="190" width="150" height="56" rx="28"/>
    <text class="n" x="475" y="215" text-anchor="middle">MySQL</text>
    <text class="s" x="475" y="233" text-anchor="middle">chat context</text>
  </g>
</svg>

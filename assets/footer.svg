    <style>.h { font: 800 34px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #edeafb; letter-spacing: -0.5px; } .p { font: 400 17px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #aaa3cd; }</style></defs>
